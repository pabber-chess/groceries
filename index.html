<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groceries</title>
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1d1d1b;--muted:#7a776f;--line:#e7e4dc;--acc:#2f7d4f;--acc-ink:#fff;--acc-soft:#e3f1e8;--danger:#c0392b;--done:#a29f97;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#141513;--card:#1f201e;--ink:#ecebe6;--muted:#9a978f;--line:#2e2f2c;--acc:#4caf74;--acc-ink:#0d1a12;--acc-soft:#1e3326;--danger:#e2695c;--done:#6f6d68;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;font-size:16px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:center;justify-content:space-between}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.icon-btn{background:none;border:0;font-size:22px;color:var(--muted);padding:6px 8px;line-height:1}
.status{background:none;border:0;padding:0;margin:0 0 10px;color:var(--muted);font-size:13px;text-align:left}
.status.err{color:var(--danger)}
form{position:relative}
.add-row{display:flex;gap:8px}
.add-row input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;min-width:0;outline:none}
.add-row input:focus{border-color:var(--acc)}
#addName{flex:1}
.qty-in{width:96px;flex:none}
.add-btn{width:48px;flex:none;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-size:28px;line-height:1}
.suggest{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);overflow:hidden;z-index:6}
.suggest button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.suggest button:first-child{border-top:0}
.suggest .tag{margin-left:auto;color:var(--muted);font-size:13px}
main{padding:2px 14px}
.cat{margin-top:18px}
.cat h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 6px 7px;display:flex;align-items:center;gap:8px;font-weight:650}
.cat h2 .ic{font-size:17px;letter-spacing:0}
.cnt{margin-left:auto;font-weight:500}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.item{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none}
.item+.item{border-top:1px solid var(--line)}
.row{position:relative;z-index:1;background:var(--card);display:flex;align-items:baseline;gap:10px;padding:14px 16px;min-height:50px;transition:transform .2s ease}
.item.swiping .row{transition:none}
.swipe-bg{position:absolute;inset:0;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;padding-left:18px;font-weight:650;font-size:15px}
.item.armed .swipe-bg{background:var(--acc);color:var(--acc-ink)}
.nm{flex:1;overflow-wrap:anywhere}
.qty{color:var(--muted);font-size:14px;white-space:nowrap}
.done .nm,.done .qty{text-decoration:line-through;color:var(--done)}
.item:focus-visible .row{box-shadow:inset 0 0 0 2px var(--acc)}
.flash .row{animation:flash 1.3s ease}
@keyframes flash{0%,45%{background:var(--acc-soft)}100%{background:var(--card)}}
.done-sec h2{margin-top:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.danger-t{color:var(--danger)}
.btn.wide{display:block;width:100%;margin-top:12px}
.btn:disabled{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:56px 24px 0}
.empty b{display:block;font-size:40px;margin-bottom:8px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:22px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:#2a2a28;color:#fff;border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;z-index:40;width:max-content;max-width:calc(100% - 28px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px;min-height:44px}
.toast span{padding:4px 0}
.toast button{background:none;border:0;color:#8fe0ad;font-weight:700;font-size:15px;padding:8px 10px;white-space:nowrap}
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.dlg-wrap{z-index:30;align-items:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.dlg{border-radius:16px;margin:20px;max-width:380px;padding:20px;animation:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet h3{margin:0;font-size:19px}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px}
.field input,.newcat input,.hrow input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;outline:none}
.field input:focus,.newcat input:focus,.hrow input:focus{border-color:var(--acc)}
.two{display:flex;gap:10px}.two .grow{flex:1;min-width:0}.two .qtyf{width:110px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 13px;font-size:15px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.add{border-style:dashed;color:var(--muted)}
.newcat{display:flex;gap:8px;margin-top:10px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow.spread{justify-content:space-between}
.card{background:var(--card);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.sec-h{font-weight:700;font-size:15px;margin-bottom:6px}
.sub-h{font-weight:650;font-size:14px;margin-top:16px}
details summary{cursor:pointer}
.small{font-size:14px;margin:6px 0}
.muted{color:var(--muted)}
.steps{padding-left:20px;margin:6px 0 4px}
.steps li{margin:3px 0}
a{color:var(--acc)}
.or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 2px}
.hrow{display:flex;gap:6px;align-items:center;margin-top:8px}
.hrow .hicon{width:46px;flex:none;text-align:center;padding:10px 4px}
.hrow .hname{flex:1;min-width:0}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:9px;width:38px;height:42px;flex:none;font-size:16px;padding:0}
.mini-sp{width:38px;flex:none}
.lrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.lrow span:first-child{flex:1}
.dlg p{margin:0 0 6px;font-size:16px}
</style>
</head>
<body>
<header class="top">
  <div class="title-row">
    <h1>Groceries</h1>
    <button id="gear" class="icon-btn" aria-label="Settings">⚙︎</button>
  </div>
  <button id="status" class="status" type="button"></button>
  <form id="addForm" autocomplete="off">
    <div class="add-row">
      <input id="addName" placeholder="Add item…" enterkeyhint="done" autocapitalize="sentences" autocorrect="off" spellcheck="false" aria-label="Item">
      <input id="addQty" class="qty-in" placeholder="Amount" enterkeyhint="done" autocorrect="off" aria-label="Amount (optional)">
      <button class="add-btn" aria-label="Add">+</button>
    </div>
    <div id="suggest" class="suggest" hidden></div>
  </form>
</header>
<main id="list"></main>
<div id="toast" class="toast" hidden role="status"></div>
<div id="sheetWrap" class="sheet-wrap" hidden><div class="backdrop"></div><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="dlgWrap" class="sheet-wrap dlg-wrap" hidden><div class="backdrop"></div><div id="dlg" class="sheet dlg" role="alertdialog" aria-modal="true"></div></div>

  if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';

  catch (e) { return false; }
}

/* ============ rendering ============ */
const listEl = $('list'), statusEl = $('status');
let swipe = null, renderPending = false, flashId = null;

function statusText() {
  if (!sync) return 'Only on this device · tap to set up sharing';
  if (syncState === 'syncing') return 'Syncing…';
  if (syncState === 'offline') return 'Offline · changes are saved here and sync later';
  if (syncState === 'error') return 'Sync problem: ' + syncMsg + ' · tap for settings';
  if (!lastSync) return 'Connecting…';
  return (pending() ? 'Saving… · last synced ' : 'Synced ') + fmtTime(lastSync);
}
function renderStatus() { statusEl.textContent = statusText(); statusEl.classList.toggle('err', syncState === 'error'); }

function rowHtml(i) {
  return `<li class="item${i.done ? ' done' : ''}${i.id === flashId ? ' flash' : ''}" data-id="${i.id}" tabindex="0">` +
    `<div class="swipe-bg" aria-hidden="true">${i.done ? '↺ Back on the list' : '✓ Got it'}</div>` +
    `<div class="row"><span class="nm">${esc(i.name)}</span>${i.qty ? `<span class="qty">${esc(i.qty)}</span>` : ''}</div></li>`;
}
function render() {
  if (swipe) { renderPending = true; return; }
  renderPending = false;
  const items = Object.values(doc.items).filter(i => !i.del);
  const open = items.filter(i => !i.done);
  const done = items.filter(i => i.done).sort((a,b) => (b.doneAt || 0) - (a.doneAt || 0));
  let h = '';
  if (!items.length) h = `<div class="empty"><b>🛒</b>The list is empty.<br>Add something above – in Danish or English.</div>`;
  else if (!open.length) h = `<div class="empty"><b>🎉</b>Everything is crossed off.</div>`;
  for (const c of activeCats()) {
    const its = open.filter(i => catOf(i) === c.id).sort((a,b) => a.added - b.added);
    if (!its.length) continue;
    h += `<section class="cat"><h2><span class="ic">${esc(c.icon || '🏷️')}</span>${esc(c.name)}<span class="cnt">${its.length}</span></h2><ul>${its.map(rowHtml).join('')}</ul></section>`;
  }
  if (done.length) h += `<section class="cat done-sec"><h2><span class="ic">✓</span>Crossed off<span class="cnt">${done.length}</span></h2><ul>${done.map(rowHtml).join('')}</ul>` +
    `<button class="btn danger wide" data-act="clearDone">Delete all crossed-out items</button></section>`;
  if (items.length) h += `<p class="hint">Swipe right to cross off · tap to edit</p>`;
  listEl.innerHTML = h;
  renderStatus();
}
function flash(id) {
  flashId = id; render();
  const el = listEl.querySelector(`[data-id="${id}"]`);
  if (el) el.scrollIntoView({ block:'center', behavior:'smooth' });
  setTimeout(() => { if (flashId === id) flashId = null; }, 1400);
}

/* ============ toast ============ */
const toastEl = $('toast'); let toastTimer = null, toastFn = null;
function toast(msg, action, fn) {

/* ask where an unknown item goes */
function askCategory(name, qty) {
  let done = false;

    if (done) return; done = true;

/* edit an item */
function openEdit(id) {
  const it = doc.items[id]; if (!it || it.del) return;
  let sel = catOf(it), touched = false;
  const doSave = () => {
    const cur = doc.items[id]; if (!cur || cur.del) return closeSheet(false);
    const name = cap($('eName').value.trim()); const qty = $('eQty').value.trim();
    if (!name) { $('eName').focus(); return; }
    const renamed = norm(name) !== norm(cur.name);
    let c = sel;
    if (renamed && !touched) { const r = categorize(name, qty); if (r) c = r.c; }
    if (touched) learn(name, c);
    if (renamed) {
      const ok = norm(cur.name), h = doc.hist[ok];
      if (h && !h.del && (h.n || 0) <= 1) doc.hist[ok] = { del:true, t:now() };
      bumpHist(name, c);
    }
    closeSheet(false);
    updItem(id, { name, qty, c });
  };
  const addNewCat = () => { const v = $('newCatName').value.trim(); if (!v) return; sel = createCat(v); touched = true; $('chips').innerHTML = chipsHtml(sel); $('newCatBox').hidden = true; };
  openSheet({
    html: `<div class="sheet-h"><h3>Edit</h3><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
      <div class="two"><label class="field grow"><span>Item</span><input id="eName" value="${esc(it.name)}" autocapitalize="sentences" autocorrect="off" spellcheck="false"></label>
      <label class="field qtyf"><span>Amount</span><input id="eQty" value="${esc(it.qty || '')}" placeholder="optional" autocorrect="off"></label></div>
      <div class="field"><span>Heading</span><div class="chips" id="chips">${chipsHtml(sel)}</div></div>${newCatBox}
      <div class="btnrow spread"><button class="btn ghost danger-t" type="button" data-act="delete">Delete</button><button class="btn primary" type="button" data-act="save">Save</button></div>`,
    act(a, el) {
      if (a === 'pick') { sel = el.dataset.cid; touched = true; sheetEl.querySelectorAll('.chip[data-cid]').forEach(ch => ch.classList.toggle('on', ch.dataset.cid === sel)); }
      else if (a === 'newcat') { $('newCatBox').hidden = false; $('newCatName').focus(); }
      else if (a === 'mkcat') addNewCat();
      else if (a === 'save') doSave();
      else if (a === 'delete') {
        const cur = doc.items[id]; closeSheet(false); if (!cur) return;
        updItem(id, { del:true });
        toast(`Deleted ${cur.name}`, 'Undo', () => updItem(id, { del:false }));
      }
    },
    enter(inp) { if (inp.id === 'newCatName') addNewCat(); else doSave(); }
  });
}

    `<button class="mini" type="button" data-act="up" aria-label="Move up">↑</button><button class="mini" type="button" data-act="down" aria-label="Move down">↓</button>` +
    (c.id === 'other' ? `<span class="mini-sp"></span>` : `<button class="mini danger-t" type="button" data-act="delcat" aria-label="Delete heading">✕</button>`) + `</div>`;

  s += `<section class="card"><details id="learnedDet"${learnedOpen ? ' open' : ''}><summary class="sec-h">Words the app has learned (${learned.length})</summary>` +
    (learned.length ? learned.map(([k, v]) => `<div class="lrow" data-k="${esc(k)}"><span>${esc(k)}</span><span class="muted">${esc(catName(v.c))}</span><button class="mini" type="button" data-act="forget" aria-label="Forget">✕</button></div>`).join('')
      : `<p class="small muted">When you put an item under a different heading, the app remembers it and lists it here.</p>`) + `</details></section>`;

function refreshSettings() {
  if (!sheetCfg || sheetCfg.kind !== 'settings') return;
  const det = $('learnedDet'); if (det) learnedOpen = det.open;
  const top = sheetEl.scrollTop; sheetEl.innerHTML = settingsHtml(); sheetEl.scrollTop = top;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok; }
}
function openSettings() {
  openSheet({
    kind:'settings', html: settingsHtml(),
    async act(a, el) {
      const cid = el.closest('[data-cid]') && el.closest('[data-cid]').dataset.cid;
      if (a === 'connect') {
        const tok = $('tokIn').value.trim(); if (!tok) { $('tokIn').focus(); return; }
        el.disabled = true; el.textContent = 'Connecting…';
        try { await connectWithToken(tok); toast('Connected – the list now syncs'); }
        catch (e) { toast(e.status === 401 ? 'GitHub didn’t accept that token' : e.status ? 'GitHub error ' + e.status + ' – check the token has “gist” ticked' : 'No connection – try again'); }
        refreshSettings();
      } else if (a === 'join') {
        if (joinFrom($('linkIn').value)) { toast('Connected to the shared list'); refreshSettings(); } else toast('That doesn’t look like a setup link');
      } else if (a === 'syncnow') { await syncNow(true); refreshSettings(); }
      else if (a === 'share') { try { await navigator.share({ title:'Grocery list', text:'Open this to connect to our shared grocery list', url: joinLink() }); } catch (e) {} }
      else if (a === 'copy') toast(await copyText(joinLink()) ? 'Link copied' : 'Couldn’t copy the link');
      else if (a === 'disconnect') confirmDlg('Disconnect this device? The list stays here but stops syncing.', 'Disconnect', () => { setSync(null); renderStatus(); refreshSettings(); });
      else if (a === 'up' || a === 'down') { moveCat(cid, a === 'up' ? -1 : 1); refreshSettings(); }
      else if (a === 'delcat') confirmDlg(`Delete the heading “${doc.cats[cid].name}”? Its items move to ${doc.cats.other.name}.`, 'Delete', () => { deleteCat(cid); refreshSettings(); });
      else if (a === 'addcat') { const v = $('newCatIn').value.trim(); if (v) { createCat(v); refreshSettings(); } }
      else if (a === 'forget') { const k = el.closest('[data-k]').dataset.k; doc.learned[k] = { del:true, t:now() }; learnedOpen = true; commit(); refreshSettings(); }
    },
    change(e) {
      const row = e.target.closest('[data-cid]'); if (!row) return;
      const c = doc.cats[row.dataset.cid]; if (!c) return;
      const v = e.target.value.trim();
      if (e.target.classList.contains('hname') && v && v !== c.name) { c.name = v; c.t = now(); commit(); }
      if (e.target.classList.contains('hicon') && v !== (c.icon || '')) { c.icon = v; c.t = now(); commit(); }
    },
    enter(inp) {
      if (inp.id === 'newCatIn') { const v = inp.value.trim(); if (v) { createCat(v); refreshSettings(); } }
      else if (inp.id === 'tokIn') sheetEl.querySelector('[data-act="connect"]').click();
      else if (inp.id === 'linkIn') sheetEl.querySelector('[data-act="join"]').click();
      else inp.blur();
    }
  });
}

/* ============ adding items ============ */
const addName = $('addName'), addQty = $('addQty'), suggestEl = $('suggest');
function submitEntry(raw, qExplicit) {
  let { name, qty } = parseEntry(raw);
  if (qExplicit) qty = qExplicit;
  if (!name) return;
  name = cap(name);
  addName.value = ''; addQty.value = ''; hideSuggest();
  const dup = findDup(name);
  if (dup) {
    if (dup.done) { updItem(dup.id, { done:false, doneAt:null, ...(qty ? { qty } : {}) }); bumpHist(dup.name, catOf(dup)); flash(dup.id); toast(`${dup.name} is back on the list`); }
    else { flash(dup.id); toast(`${dup.name} is already on the list`, 'Add anyway', () => proceedAdd(name, qty)); }
    return;
  }
  proceedAdd(name, qty);
}
function proceedAdd(name, qty) {
  const r = categorize(name, qty);
  if (!r) return askCategory(name, qty);
  const id = addItem(name, qty, r.c); flash(id);
  toast(`${name} → ${catName(r.c)}`, 'Change', () => openEdit(id));
}
$('addForm').addEventListener('submit', e => { e.preventDefault(); submitEntry(addName.value, addQty.value.trim()); if (sheetWrap.hidden) addName.focus(); });
addQty.addEventListener('focus', hideSuggest);

function hideSuggest() { suggestEl.hidden = true; suggestEl.innerHTML = ''; }
function updateSuggest() {
  const q = norm(parseEntry(addName.value).name);
  if (!q) return hideSuggest();
  const onList = new Set(Object.values(doc.items).filter(i => !i.del && !i.done).map(i => norm(i.name)));
  const list = Object.entries(doc.hist)
    .filter(([k, h]) => !h.del && k !== q && (k.startsWith(q) || k.includes(' ' + q)))
    .sort((a, b) => (b[1].n - a[1].n) || (b[1].t - a[1].t)).slice(0, 5);
  if (!list.length) return hideSuggest();
  suggestEl.innerHTML = list.map(([k, h]) => `<button type="button" data-name="${esc(h.name)}">${esc((doc.cats[h.c] && doc.cats[h.c].icon) || '🏷️')} ${esc(h.name)}${onList.has(k) ? '<span class="tag">on the list</span>' : ''}</button>`).join('');
  suggestEl.hidden = false;
}
addName.addEventListener('input', updateSuggest);
addName.addEventListener('blur', () => setTimeout(hideSuggest, 150));
suggestEl.addEventListener('pointerdown', e => e.preventDefault());
suggestEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-name]'); if (!b) return;
  const typed = parseEntry(addName.value).qty;
  submitEntry(b.dataset.name, addQty.value.trim() || typed); if (sheetWrap.hidden) addName.focus();
});

/* ============ list interaction: swipe right = cross off, tap = edit ============ */
function toggleDone(id) {
  const it = doc.items[id]; if (!it || it.del) return;
  const done = !it.done;
  updItem(id, { done, doneAt: done ? now() : null });
  if (done) toast(`Crossed off ${it.name}`, 'Undo', () => updItem(id, { done:false, doneAt:null }));
}
function tapItem(id) { const it = doc.items[id]; if (!it) return; if (it.done) toggleDone(id); else openEdit(id); }
const swipeLimit = li => Math.min(110, li.offsetWidth * 0.3);
function snapBack(s) { s.row.style.transform = ''; s.li.classList.remove('swiping', 'armed'); }

listEl.addEventListener('pointerdown', e => {
  const li = e.target.closest('.item'); if (!li || e.button > 0 || swipe) return;
  swipe = { li, id: li.dataset.id, row: li.querySelector('.row'), x: e.clientX, y: e.clientY, dx: 0, mode: null, pid: e.pointerId };
});
listEl.addEventListener('pointermove', e => {
  const s = swipe; if (!s || e.pointerId !== s.pid) return;
  const dx = e.clientX - s.x, dy = e.clientY - s.y;
  if (!s.mode && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    if (dx > 0 && Math.abs(dx) > Math.abs(dy) * 1.2) { s.mode = 'swipe'; s.li.classList.add('swiping'); try { s.li.setPointerCapture(e.pointerId); } catch (_) {} }
    else s.mode = 'other';
  }
  if (s.mode === 'swipe') {
    s.dx = Math.max(0, dx);
    s.row.style.transform = `translateX(${s.dx}px)`;
    s.li.classList.toggle('armed', s.dx > swipeLimit(s.li));
    e.preventDefault();
  }
});
listEl.addEventListener('pointerup', e => {
  const s = swipe; if (!s || e.pointerId !== s.pid) return;
  swipe = null;
  if (s.mode === 'swipe') {
    if (s.dx > swipeLimit(s.li)) {
      s.li.classList.remove('swiping');
      s.row.style.transform = `translateX(${s.li.offsetWidth}px)`;
      setTimeout(() => toggleDone(s.id), 170);
      return;
    }
    snapBack(s);
  } else if (!s.mode) tapItem(s.id);
  if (renderPending) render();
});
window.addEventListener('pointerup', e => { const s = swipe; if (!s || e.pointerId !== s.pid) return; swipe = null; if (s.mode === 'swipe') snapBack(s); if (renderPending) render(); });
listEl.addEventListener('pointercancel', () => { const s = swipe; swipe = null; if (s && s.mode === 'swipe') snapBack(s); if (renderPending) render(); });
listEl.addEventListener('keydown', e => {
  const li = e.target.closest('.item'); if (!li) return;
  if (e.key === 'Enter') { e.preventDefault(); tapItem(li.dataset.id); }
  else if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); toggleDone(li.dataset.id); }
});
listEl.addEventListener('click', e => {
  if (!e.target.closest('[data-act="clearDone"]')) return;
  const done = Object.values(doc.items).filter(i => !i.del && i.done);
  if (!done.length) return;
  confirmDlg(`Delete ${done.length} crossed-out item${done.length > 1 ? 's' : ''}?`, 'Delete', () => {
    const t = now(), ids = done.map(i => i.id);
    for (const id of ids) Object.assign(doc.items[id], { del:true, t });
    commit();
    toast(`Deleted ${ids.length} item${ids.length > 1 ? 's' : ''}`, 'Undo', () => { const t2 = now(); for (const id of ids) if (doc.items[id]) Object.assign(doc.items[id], { del:false, t:t2 }); commit(); });
  });
});

$('gear').addEventListener('click', openSettings);
statusEl.addEventListener('click', () => { if (!sync || syncState === 'error') openSettings(); else syncNow(true); });

}

if (sync) syncNow(true);
